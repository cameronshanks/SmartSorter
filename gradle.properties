# MEMORY FIX - 1GB is WAY too low for multi-version builds!
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Xss2M
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon.idletimeout=10800000

# Parallel downloads (important for Asia mirrors)
org.gradle.parallel.threads=4

# Fabric Properties
minecraft_version=26.1.2
loader_version=0.19.5

# Mod Properties
mod_version=4.0.0
maven_group=net.shaddii.smartsorter
archives_base_name=smart-sorter

# Dependencies
fabric_version=0.155.3+26.1.2

# Loom optimizations for multi-version
loom.refresh.dependencies=false